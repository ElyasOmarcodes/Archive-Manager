name: د وینډوز خروجي جوړول (Build Windows EXE)

# کله چې دې څانګو ته پش وشي، یا په لاسي توګه چلول کیږي.
on:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'یوه GitHub Release هم جوړه کړه'
        type: boolean
        default: false
      tag:
        description: 'د ریلیز ټګ (که پورتنی فعال وي)'
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'
  APP_NAME: 'ArchiveManager'
  APP_VERSION: '1.4.0'
  RELEASE_TAG: 'v1.4.0'

jobs:
  # ═══════════════════════════════════════════════════════════
  #  ۱) ازموینې — که ماتې وخوري، خروجي نه جوړیږي
  # ═══════════════════════════════════════════════════════════
  test:
    name: ازموینې او د کوډ کتنه
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: پکېجونه راوړل
        run: flutter pub get

      - name: د کوډ کتنه
        run: flutter analyze --no-fatal-infos

      - name: ازموینې
        run: flutter test

  # ═══════════════════════════════════════════════════════════
  #  ۲) د وینډوز جوړونه + فوق‌العاده کمپرس
  # ═══════════════════════════════════════════════════════════
  build:
    name: د وینډوز .exe جوړول
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: پکېجونه راوړل
        run: flutter pub get

      - name: د وینډوز ریلیز جوړول
        run: flutter build windows --release

      # ═══════════════════════════════════════════════════════
      #  یو واحد .exe جوړول
      # ═══════════════════════════════════════════════════════
      #
      # Flutter یو فولډر ورکوي: .exe + DLLونه + `data/`. کاروونکي
      # وغوښتل چې وروستی خروجي **یو واحد فایل** وي. نو د بستې ټول
      # فایلونه په یوه ZIP کې راټولوو او هغه د یوه کوچني اصلي
      # (native) لانچر **دننه** ځای پر ځای کوو — د وینډوز د
      # «resource» په بڼه.
      #
      # لومړی ځل چې وچلیږي، ځان `%LOCALAPPDATA%\Arvitch\<نسخه>` ته
      # راوباسي او پروګرام پیلوي؛ له هغه روسته سمدستي پیلیږي.

      - name: د بستې ZIP جوړول
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$src/${{ env.APP_NAME }}.exe")) {
            throw "د Flutter خروجي ونه موندل شو: $src"
          }
          Get-ChildItem -Recurse $src |
            Measure-Object -Property Length -Sum |
            ForEach-Object { "خام حجم: {0:N1} MB" -f ($_.Sum / 1MB) }

          # `tar.exe` (bsdtar) ZIP جوړوي — هماغه چې لانچر یې لولي.
          Push-Location $src
          tar.exe -a -c -f "$env:GITHUB_WORKSPACE/windows/launcher/payload.zip" *
          Pop-Location
          $z = Get-Item "windows/launcher/payload.zip"
          "بسته: {0:N1} MB" -f ($z.Length / 1MB)

      - name: د MSVC چاپېریال
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: لانچر جوړول
        shell: cmd
        working-directory: windows/launcher
        run: |
          rc.exe /nologo /fo launcher.res launcher.rc || exit /b 1
          cl.exe /nologo /O2 /EHsc /std:c++17 /DNDEBUG ^
            /DUNICODE /D_UNICODE ^
            /DAPP_VERSION=\"${{ env.APP_VERSION }}\" ^
            /DAPP_EXE=\"${{ env.APP_NAME }}.exe\" ^
            launcher.cpp launcher.res ^
            /Fe:${{ env.APP_NAME }}.exe ^
            /link /SUBSYSTEM:WINDOWS shell32.lib ole32.lib user32.lib uuid.lib || exit /b 1

      # ── تایید: ریښتیا کار کوي که نه؟ ──
      #
      # لانچر چلوو او ګورو چې آیا ځان یې سم راویستلی دی. که نه،
      # جوړونه همدلته ماتیږي — نو ناسم خروجي هیڅکله نه خپریږي.
      - name: د لانچر تایید
        shell: pwsh
        run: |
          $exe = "windows/launcher/${{ env.APP_NAME }}.exe"
          $size = (Get-Item $exe).Length
          "د لانچر حجم: {0:N1} MB" -f ($size / 1MB)

          $target = "$env:LOCALAPPDATA\Arvitch\v${{ env.APP_VERSION }}"
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }

          $p = Start-Process -FilePath $exe -PassThru
          # لومړی ځل ځان راوباسي — څو ثانیې ورکوو
          Start-Sleep -Seconds 25

          if (-not (Test-Path "$target/${{ env.APP_NAME }}.exe")) {
            Get-ChildItem -Recurse $target -ErrorAction SilentlyContinue |
              Select-Object -First 30 FullName
            throw "لانچر ځان ځای پر ځای نه کړ — خروجي نیمګړی دی"
          }
          if (-not (Test-Path "$target/data/icudtl.dat")) {
            throw "د `data/` فولډر نیمګړی دی"
          }
          "✓ لانچر ځان سم راویست"

          Get-Process -Name "${{ env.APP_NAME }}" -ErrorAction SilentlyContinue |
            Stop-Process -Force
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      # ── xz بسته‌بندي ──
      #
      # **پام:** دلته xz ډېر لږ کموي (~۱٪)، او دا سم دی — د exe
      # دننه بسته لا دمخه ZIP (deflate) ده، نو دوه‌ځلې کمپرس
      # ګټه نه لري. اصلي کمپرس هماغه ZIP کوي: ~۴۰MB → ~۱۴MB.
      #
      # نو ولې لا هم xz؟ ځکه چې د تحویل بڼه یې غوښتل شوې، او
      # لګښت یې صفر دی. د دې پر ځای چې بسته بې‌کمپرسه ودروو او
      # xz ته یې پرېږدو، دا لار غوره ده: هغه به ډانلوډ لږ څه
      # کوچنی کړي، خو کاروونکي ته به یو ۴۰MB exe پاتې شي.
      # دلته کاروونکی یوازې یو ۱۴MB فایل ساتي.
      - name: xz بسته‌بندي
        shell: bash
        run: |
          mkdir -p dist
          cp "windows/launcher/${APP_NAME}.exe" "dist/${APP_NAME}.exe"
          cd dist
          raw=$(wc -c < "${APP_NAME}.exe")
          xz -9 --extreme --threads=0 --keep "${APP_NAME}.exe"
          small=$(wc -c < "${APP_NAME}.exe.xz")
          # ساده bash حساب — `bc` په وینډوز bash کې د باور وړ نه و
          echo "─────────────────────────────────"
          echo "exe:     $((raw / 1048576)) MB   ($raw bytes)"
          echo "exe.xz:  $((small / 1048576)) MB   ($((100 * small / raw))% د خام)"
          echo "─────────────────────────────────"
          rm -f "${APP_NAME}.exe"
          # د ریلیز پړاو ته یې ورکوو
          echo "EXE_BYTES=$raw" >> "$GITHUB_ENV"
          echo "XZ_BYTES=$small" >> "$GITHUB_ENV"

      - name: د خروجي اپلوډ
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-x64
          path: dist/${{ env.APP_NAME }}.exe.xz
          # فایل مخکې کمپرس شوی — نو دوه‌ځلې کمپرس ته اړتیا نشته
          compression-level: 0
          retention-days: 90

      # ═══════════════════════════════════════════════════════
      #  ریلیز — زاړه پاکوي، نوی خپروي
      # ═══════════════════════════════════════════════════════
      #
      # کاروونکي وغوښتل چې یوازې **وروستی** خروجي په Releases کې
      # وي. نو لومړی هغه ریلیزونه پاکوو چې زاړه دي (د اوسني ټګ
      # پرته)، بیا نوی جوړوو.
      #
      # دا **idempotent** دی: تر لومړۍ چلونې روسته یوازې اوسنی
      # ریلیز پاتې وي، نو بیا هیڅ نه پاکیږي.
      - name: زاړه ریلیزونه پاکول
        if: github.ref == 'refs/heads/claude/archive-quick-manager-4pdyru' || startsWith(github.ref, 'refs/tags/v') || inputs.release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep="${{ env.RELEASE_TAG }}"
          echo "ساتل کیږي: $keep"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName --jq '.[].tagName' | while read -r tag; do
            [ -z "$tag" ] && continue
            if [ "$tag" != "$keep" ]; then
              echo "  ✗ پاکیږي: $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" \
                --cleanup-tag --yes || true
            fi
          done

      - name: ریلیز خپرول
        if: github.ref == 'refs/heads/claude/archive-quick-manager-4pdyru' || startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: د آرشیف چټک مدیر — ${{ env.RELEASE_TAG }}
          files: dist/${{ env.APP_NAME }}.exe.xz
          make_latest: true
          body: |
            ## د آرشیف چټک مدیر

            **یو واحد فایل** — نصبولو ته اړتیا نشته.

            ### د ډانلوډ او چلولو لار

            ۱. لاندې `${{ env.APP_NAME }}.exe.xz` ډانلوډ کړئ
            ۲. راوباسئ یې — یو ځل بس دی:

               ```
               tar -xf ArchiveManager.exe.xz
               ```

               (یا د [7-Zip](https://www.7-zip.org/) په مرسته
               ورباندې دوه ځله کلیک وکړئ)

            ۳. `${{ env.APP_NAME }}.exe` چلوئ

            > **لومړی ځل** څو ثانیې نیسي — پروګرام ځان
            > `%LOCALAPPDATA%\Arvitch\` ته ځای پر ځای کوي.
            > **له هغه روسته** سمدستي پیلیږي.

            ### د ازموینې نمونه آرشیف

            پروګرام پرته له خپلې ډیټا وازمویئ — **۵,۰۰۰ فرضي
            پیښې**، ۱۲,۴۶۲ ضمیمې، هره پیښه خپله `index.html` لري:

            [`docs/sample/Arvitch-Sample-Archive.tar.xz`](https://github.com/${{ github.repository }}/raw/${{ github.sha }}/docs/sample/Arvitch-Sample-Archive.tar.xz)
            · ۱.۸ MB (راوتلی: ۲۱۷ MB)

            ### په دې نسخه کې نوي (v1.4.0)

            * **د کړکۍ تڼۍ ښي لور ته** — د وینډوز په څېر، او
              «تړل» تر ټولو څنډې ته
            * **رسمي PDF** — چوکاټ لرونکي جدولونه، شمېرل شوې
              برخې، او د سند سرلیک‌کرښه
            * **XMP میټاډیټا** د PDF دننه (`dc:`, `xmp:` او د
              آرشیف خپل ډګرونه) — Acrobat او Bridge یې پخپله لولي
            * د PDF **وروستۍ پاڼه** د میټاډیټا رسمي جدول دی
            * **دوه اکسپورټ افشنونه**: یوازې PDF · یا ZIP چې PDF
              او اصلي ضمیمې پکې وي
            * د پښتو ZWNJ نور متن نه ماتوي («پ‌ښ‌تو» → «پښتو»)

            ### د v1.3.0 نوي (لا هم پکې دي)

            * **تنظیمات له سره** — رېل + محتوا (د macOS په څېر):
              بڼه · تقویم · آرشیف · لنډیز · په اړه
            * **د پروګرام خپل ایکن** اوس پروګرام دننه هم دی —
              سایډبار، د پیل پاڼه او «په اړه»
            * پورتنی بار (لټون · بیا‑سکن · تیم) یوازې په ډاشبورډ
              کې؛ د سکن پرمختګ سایډبار ته ولېږدېد، نو هره پاڼه کې
              لیدل کیږي
            * د نوي کیورډ/کټګورۍ/شخص د ثبت فیلډ د ګاونډیو هومره
              جګ شو

            ### د v1.2.0 نوي (لا هم پکې دي)

            * **د مک په څېر ټایټل بار** — د وینډوز اصلي بار او
              تڼۍ لرې شوې
            * **PDF ته اکسپورټ** — د ښودنې پاڼې کې؛ اصلي
              `metadata.json` د PDF دننه ریښتینې ضمیمه ده
            * **د پروګرام د اندازې تنظیم** — نو پر پرده کې زیات
              شیان ځای ونیسي
            * د سکرول بار په موس کش کیږي · د ټولو ساحو لوړوالی
              یو شان · د ټولې شوې ډلې حالت نه ورکیږي
            * د ډرایو دایروي پروګرس سم سلنه ښیي

            ### سیسټم

            وینډوز ۱۰ (۱۸۰۳) یا نوې · ۶۴-bit
