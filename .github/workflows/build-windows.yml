name: د وینډوز خروجي جوړول (Build Windows EXE)

# کله چې دې څانګو ته پش وشي، یا په لاسي توګه چلول کیږي.
on:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'یوه GitHub Release هم جوړه کړه'
        type: boolean
        default: false
      tag:
        description: 'د ریلیز ټګ (که پورتنی فعال وي)'
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'
  APP_NAME: 'ArchiveManager'
  APP_VERSION: '1.0.0'
  RELEASE_TAG: 'v1.0.0'

jobs:
  # ═══════════════════════════════════════════════════════════
  #  ۱) ازموینې — که ماتې وخوري، خروجي نه جوړیږي
  # ═══════════════════════════════════════════════════════════
  test:
    name: ازموینې او د کوډ کتنه
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: پکېجونه راوړل
        run: flutter pub get

      - name: د کوډ کتنه
        run: flutter analyze --no-fatal-infos

      - name: ازموینې
        run: flutter test

  # ═══════════════════════════════════════════════════════════
  #  ۲) د وینډوز جوړونه + فوق‌العاده کمپرس
  # ═══════════════════════════════════════════════════════════
  build:
    name: د وینډوز .exe جوړول
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: پکېجونه راوړل
        run: flutter pub get

      - name: د وینډوز ریلیز جوړول
        run: flutter build windows --release

      # ═══════════════════════════════════════════════════════
      #  یو واحد .exe جوړول
      # ═══════════════════════════════════════════════════════
      #
      # Flutter یو فولډر ورکوي: .exe + DLLونه + `data/`. کاروونکي
      # وغوښتل چې وروستی خروجي **یو واحد فایل** وي. نو د بستې ټول
      # فایلونه په یوه ZIP کې راټولوو او هغه د یوه کوچني اصلي
      # (native) لانچر **دننه** ځای پر ځای کوو — د وینډوز د
      # «resource» په بڼه.
      #
      # لومړی ځل چې وچلیږي، ځان `%LOCALAPPDATA%\Arvitch\<نسخه>` ته
      # راوباسي او پروګرام پیلوي؛ له هغه روسته سمدستي پیلیږي.

      - name: د بستې ZIP جوړول
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$src/${{ env.APP_NAME }}.exe")) {
            throw "د Flutter خروجي ونه موندل شو: $src"
          }
          Get-ChildItem -Recurse $src |
            Measure-Object -Property Length -Sum |
            ForEach-Object { "خام حجم: {0:N1} MB" -f ($_.Sum / 1MB) }

          # `tar.exe` (bsdtar) ZIP جوړوي — هماغه چې لانچر یې لولي.
          Push-Location $src
          tar.exe -a -c -f "$env:GITHUB_WORKSPACE/windows/launcher/payload.zip" *
          Pop-Location
          $z = Get-Item "windows/launcher/payload.zip"
          "بسته: {0:N1} MB" -f ($z.Length / 1MB)

      - name: د MSVC چاپېریال
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: لانچر جوړول
        shell: cmd
        working-directory: windows/launcher
        run: |
          rc.exe /nologo /fo launcher.res launcher.rc || exit /b 1
          cl.exe /nologo /O2 /EHsc /std:c++17 /DNDEBUG ^
            /DUNICODE /D_UNICODE ^
            /DAPP_VERSION=\"${{ env.APP_VERSION }}\" ^
            /DAPP_EXE=\"${{ env.APP_NAME }}.exe\" ^
            launcher.cpp launcher.res ^
            /Fe:${{ env.APP_NAME }}.exe ^
            /link /SUBSYSTEM:WINDOWS shell32.lib ole32.lib user32.lib uuid.lib || exit /b 1

      # ── تایید: ریښتیا کار کوي که نه؟ ──
      #
      # لانچر چلوو او ګورو چې آیا ځان یې سم راویستلی دی. که نه،
      # جوړونه همدلته ماتیږي — نو ناسم خروجي هیڅکله نه خپریږي.
      - name: د لانچر تایید
        shell: pwsh
        run: |
          $exe = "windows/launcher/${{ env.APP_NAME }}.exe"
          $size = (Get-Item $exe).Length
          "د لانچر حجم: {0:N1} MB" -f ($size / 1MB)

          $target = "$env:LOCALAPPDATA\Arvitch\v${{ env.APP_VERSION }}"
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }

          $p = Start-Process -FilePath $exe -PassThru
          # لومړی ځل ځان راوباسي — څو ثانیې ورکوو
          Start-Sleep -Seconds 25

          if (-not (Test-Path "$target/${{ env.APP_NAME }}.exe")) {
            Get-ChildItem -Recurse $target -ErrorAction SilentlyContinue |
              Select-Object -First 30 FullName
            throw "لانچر ځان ځای پر ځای نه کړ — خروجي نیمګړی دی"
          }
          if (-not (Test-Path "$target/data/icudtl.dat")) {
            throw "د `data/` فولډر نیمګړی دی"
          }
          "✓ لانچر ځان سم راویست"

          Get-Process -Name "${{ env.APP_NAME }}" -ErrorAction SilentlyContinue |
            Stop-Process -Force
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      # ── xz بسته‌بندي ──
      #
      # **پام:** دلته xz ډېر لږ کموي (~۱٪)، او دا سم دی — د exe
      # دننه بسته لا دمخه ZIP (deflate) ده، نو دوه‌ځلې کمپرس
      # ګټه نه لري. اصلي کمپرس هماغه ZIP کوي: ~۴۰MB → ~۱۴MB.
      #
      # نو ولې لا هم xz؟ ځکه چې د تحویل بڼه یې غوښتل شوې، او
      # لګښت یې صفر دی. د دې پر ځای چې بسته بې‌کمپرسه ودروو او
      # xz ته یې پرېږدو، دا لار غوره ده: هغه به ډانلوډ لږ څه
      # کوچنی کړي، خو کاروونکي ته به یو ۴۰MB exe پاتې شي.
      # دلته کاروونکی یوازې یو ۱۴MB فایل ساتي.
      - name: xz بسته‌بندي
        shell: bash
        run: |
          mkdir -p dist
          cp "windows/launcher/${APP_NAME}.exe" "dist/${APP_NAME}.exe"
          cd dist
          raw=$(wc -c < "${APP_NAME}.exe")
          xz -9 --extreme --threads=0 --keep "${APP_NAME}.exe"
          small=$(wc -c < "${APP_NAME}.exe.xz")
          # ساده bash حساب — `bc` په وینډوز bash کې د باور وړ نه و
          echo "─────────────────────────────────"
          echo "exe:     $((raw / 1048576)) MB   ($raw bytes)"
          echo "exe.xz:  $((small / 1048576)) MB   ($((100 * small / raw))% د خام)"
          echo "─────────────────────────────────"
          rm -f "${APP_NAME}.exe"
          # د ریلیز پړاو ته یې ورکوو
          echo "EXE_BYTES=$raw" >> "$GITHUB_ENV"
          echo "XZ_BYTES=$small" >> "$GITHUB_ENV"

      # ═══════════════════════════════════════════════════════
      #  ۲) د پوښۍ بڼه (multi-file) — د ZIP په بڼه
      # ═══════════════════════════════════════════════════════
      #
      # کاروونکي درې بڼې وغوښتې. دا دویمه ده: هماغه څه چې نصب
      # کوونکی یې پر ډیسک ږدي، خو په خام ډول — د IT څانګې لپاره
      # (شبکې ته ایښودل، خپله بسته‌بندي، یا پرته له نصبه چلول).
      - name: د پوښۍ ZIP جوړول
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          $out = "dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}-windows-x64.zip"
          Compress-Archive -Path "$src/*" -DestinationPath $out -CompressionLevel Optimal
          "{0:N1} MB — د پوښۍ ZIP" -f ((Get-Item $out).Length / 1MB)

      # ═══════════════════════════════════════════════════════
      #  ۳) نصب کوونکی (Setup.exe) — Inno Setup
      # ═══════════════════════════════════════════════════════
      - name: Inno Setup چمتو کول
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            "Inno Setup ونه موندل شو — نصبوو یې"
            choco install innosetup -y --no-progress | Out-Null
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe ونه موندل شو" }
          "ISCC: $iscc"
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: نصب کوونکی جوړول
        shell: pwsh
        run: |
          & "$env:ISCC" `
            /DMyAppVersion=${{ env.APP_VERSION }} `
            "/DPayloadDir=$($PWD.Path)\build\windows\x64\runner\Release" `
            "/O$($PWD.Path)\dist" `
            windows/installer/archive-manager.iss
          $setup = "dist/ArchiveManager-Setup-${{ env.APP_VERSION }}.exe"
          if (-not (Test-Path $setup)) { throw "نصب کوونکی جوړ نه شو" }
          "{0:N1} MB — نصب کوونکی" -f ((Get-Item $setup).Length / 1MB)

      # ── تایید: نصب کوونکی ریښتیا کار کوي؟ ──
      #
      # په چوپه بڼه یې نصبوو، ګورو چې فایلونه پر ځای دي، بیا یې
      # حذف کوو. که نصب یا حذف ماتیږي، جوړونه همدلته درېږي — نو
      # ناسم نصب کوونکی هیڅکله نه خپریږي.
      - name: د نصب کوونکي تایید
        shell: pwsh
        run: |
          $setup = "dist/ArchiveManager-Setup-${{ env.APP_VERSION }}.exe"
          $dir = "$env:LOCALAPPDATA\Programs\Arvitch\Archive Manager"
          Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if (-not (Test-Path "$dir\${{ env.APP_NAME }}.exe")) {
            throw "نصب ناکام: $dir کې exe نشته"
          }
          if (-not (Test-Path "$dir\data\icudtl.dat")) { throw "نصب نیمګړی: data\ نشته" }
          "✓ نصب بریالی"

          $un = Get-ChildItem $dir -Filter 'unins*.exe' | Select-Object -First 1
          if ($null -eq $un) { throw "Uninstaller ونه موندل شو" }
          Start-Process -FilePath $un.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep -Seconds 5
          "✓ حذف بریالی"

      - name: د خروجي اپلوډ
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-x64
          path: |
            dist/${{ env.APP_NAME }}.exe.xz
            dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}-windows-x64.zip
            dist/ArchiveManager-Setup-${{ env.APP_VERSION }}.exe
          # فایلونه مخکې کمپرس شوي — نو دوه‌ځلې کمپرس ته اړتیا نشته
          compression-level: 0
          retention-days: 90

      # ═══════════════════════════════════════════════════════
      #  ریلیز — زاړه پاکوي، نوی خپروي
      # ═══════════════════════════════════════════════════════
      #
      # کاروونکي وغوښتل چې یوازې **وروستی** خروجي په Releases کې
      # وي. نو لومړی هغه ریلیزونه پاکوو چې زاړه دي (د اوسني ټګ
      # پرته)، بیا نوی جوړوو.
      #
      # دا **idempotent** دی: تر لومړۍ چلونې روسته یوازې اوسنی
      # ریلیز پاتې وي، نو بیا هیڅ نه پاکیږي.
      - name: زاړه ریلیزونه پاکول
        if: github.ref == 'refs/heads/claude/archive-quick-manager-4pdyru' || startsWith(github.ref, 'refs/tags/v') || inputs.release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep="${{ env.RELEASE_TAG }}"
          echo "ساتل کیږي: $keep"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName --jq '.[].tagName' | while read -r tag; do
            [ -z "$tag" ] && continue
            if [ "$tag" != "$keep" ]; then
              echo "  ✗ پاکیږي: $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" \
                --cleanup-tag --yes || true
            fi
          done

      - name: ریلیز خپرول
        if: github.ref == 'refs/heads/claude/archive-quick-manager-4pdyru' || startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: د آرشیف چټک مدیر — ${{ env.RELEASE_TAG }}
          files: |
            dist/${{ env.APP_NAME }}.exe.xz
            dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}-windows-x64.zip
            dist/ArchiveManager-Setup-${{ env.APP_VERSION }}.exe
          make_latest: true
          body: |
            ## د آرشیف چټک مدیر

            د رسنیزو شواهدو د آرشیف مدیریت — پښتو، افلاین، او د
            درېیو تقویمونو سره (لمریز · قمري · میلادي).

            ### د ډانلوډ درې بڼې — کومه یوه؟

            | بڼه | چا ته؟ |
            |---|---|
            | **`ArchiveManager-Setup-${{ env.APP_VERSION }}.exe`** ⭐ | **د تل کارونې لپاره غوره.** لکه نور پروګرامونه نصبیږي: د پیل مینو، د ډیسکټاپ ایکن، او په «Apps & features» کې د حذف افشن. راتلونکې نسخې پر همدې **باندې** نصبیږي |
            | **`ArchiveManager.exe.xz`** | **پورټابل** — یو واحد فایل، نصب ته اړتیا نشته. د USB یا د ازموینې لپاره |
            | **`ArchiveManager-${{ env.APP_VERSION }}-windows-x64.zip`** | **خامه پوښۍ** — هماغه فایلونه چې نصب کوونکی یې ږدي. د IT څانګې، شبکې ته د ایښودلو یا خپلې بسته‌بندۍ لپاره |

            ### نصب (سپارښتنه)

            ۱. `ArchiveManager-Setup-${{ env.APP_VERSION }}.exe` ډانلوډ کړئ
            ۲. دوه ځله پرې کلیک وکړئ او «Next» ووهئ
            ۳. بس — پروګرام د پیل مینو کې دی

            > نصب **ادمین پاسورډ ته اړتیا نه لري** (یوازې ستاسو
            > کاروونکي لپاره نصبیږي). که غواړئ د ټولو کاروونکو
            > لپاره وي، د لومړۍ پاڼې څخه یې ټاکلی شئ.

            ### پورټابل بڼه

            ```
            tar -xf ArchiveManager.exe.xz
            ```
            (یا د [7-Zip](https://www.7-zip.org/) په مرسته). بیا
            `ArchiveManager.exe` وچلوئ — لومړی ځل څو ثانیې نیسي.

            ### څه پکې دي

            * **چټک لټون** — د ۵۰٬۰۰۰ پیښو آرشیف کې تر ۱۵۰ms لاندې
            * **درې تقویمونه** یو ځای: لمریز · قمري · میلادي
            * **د پیښې پاڼه** (`index.html`) چې پرته له پروګرامه هم
              په هر براوزر کې پرانیستل کیږي
            * **رسمي PDF** له XMP میټاډیټا او ضمیمو سره · **ZIP**
              بسته له اصلي فایلونو سره
            * **د پروګرام دننه اکسپلورر**، د پټو فایلونو افشن،
              کیوردونه · کټګورۍ · اشخاص
            * ستاسو ډیټا **پر خپل هارډ** پاتې کیږي — هیڅ پیښه
              انټرنیټ ته نه ځي

            ### راتلونکې نسخې

            پروګرام پخپله ګوري چې نوې نسخه راغلې که نه (تنظیمات →
            په اړه). نوې نسخه پر زړې **باندې** نصبیږي — آرشیف،
            تنظیمات او ایندکس پر خپل ځای پاتې کیږي.

            ### سیسټم

            وینډوز ۱۰ (۱۸۰۳) یا نوې · ۶۴-bit
